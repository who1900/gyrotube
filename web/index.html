<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#121316">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>GyroView</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="gl"></canvas>
<video id="v" playsinline webkit-playsinline preload="auto" crossorigin="anonymous"></video>

<main id="start">
  <div class="wrap">
    <header class="brand">
      <svg class="logo" viewBox="0 0 108 108" aria-hidden="true"><rect width="108" height="108" rx="30" fill="#121316"/><g transform="rotate(-20 54 54)"><ellipse cx="54" cy="54" rx="40" ry="14" fill="none" stroke="#FFB870" stroke-opacity=".45" stroke-width="6"/></g><rect x="38" y="17" width="32" height="74" rx="9" fill="#121316" stroke="#F2E7DC" stroke-width="6"/><g transform="rotate(-20 54 54)"><path d="M14 54a40 14 0 0 0 80 0" fill="none" stroke="#FFB870" stroke-width="6" stroke-linecap="round"/></g><circle cx="54" cy="54" r="9" fill="#FFB870"/></svg>
      <div><h1>GyroView</h1><p>Vertical player with a gyroscope</p></div>
    </header>
    <button class="hero" id="sDemo" type="button">
      <span class="thumb"><svg viewBox="0 0 24 24" class="ln fi"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg></span>
      <span class="ht"><b>Test clip</b><small>Bundled clip · 720p · 30 s</small></span>
    </button>
    <h2>Open</h2>
    <div class="list">
      <label class="item" id="sFileL"><svg viewBox="0 0 24 24" class="ln"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
        <span><b>Video on this device</b><small>MP4, WebM</small></span><input id="sFile" type="file" accept="video/*,.mp4,.webm,.m4v,.mov"></label>
      <button class="item" id="sHls" type="button"><svg viewBox="0 0 24 24" class="ln"><path d="M2 8V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/><path d="M2 12a9 9 0 0 1 8 8"/><path d="M2 16a5 5 0 0 1 4 4"/><line x1="2" x2="2.01" y1="20" y2="20"/></svg>
        <span><b>HLS demo stream</b><small>Big Buck Bunny · network</small></span></button>
    </div>
    <div class="field">
      <svg viewBox="0 0 24 24" class="ln"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      <input id="sUrl" type="url" placeholder="Link .mp4 / .webm / .m3u8" autocomplete="off" enterkeyhint="go">
      <button id="sOpen" type="button" class="fbtn">Open</button>
    </div>
    <p id="sErr" role="alert"></p>
    <p class="note">Turn the phone sideways to see the whole frame. With rotation lock on, the picture turns itself.</p>
  </div>
</main>
<script src="gvkit.js"></script>
<script src="app.js"></script>
</body>
</html>
